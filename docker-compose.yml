services:
  db:
    image: postgres:16-alpine
    container_name: medfast_db
    restart: always
    environment:
      POSTGRES_DB: medfast
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_db_data:/var/lib/postgresql/data
volumes:
  postgres_db_data: