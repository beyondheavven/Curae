apiVersion: v1
kind: ConfigMap
metadata:
  name: curae-config
  namespace: curae
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  CHAT_RABBIT_ENABLED: "true"
  APP_BASE_URL: https://api.curae.local
  CORS_ALLOWED_ORIGINS: https://api.curae.local,https://grafana.curae.local
  WEBSOCKET_ALLOWED_ORIGINS: https://api.curae.local,https://grafana.curae.local
  EMAIL_VERIFICATION_TTL_MS: "3600000"
  AUTH_DB_NAME: curae_auth
  APPOINTMENT_DB_NAME: curae_appointment
  PAYMENT_DB_NAME: curae_payment
  NOTIFICATION_DB_NAME: curae_notification
  PROFILE_DB_NAME: curae_profile
  PROVIDER_DB_NAME: curae_provider
  CHAT_DB_NAME: curae_chat
  AUTH_SERVICE_URL: http://auth-service:8081
  APPOINTMENT_SERVICE_URL: http://appointment-service:8082
  PAYMENT_SERVICE_URL: http://payment-service:8083
  NOTIFICATION_SERVICE_URL: http://notification-service:8084
  USER_PROFILE_SERVICE_URL: http://user-profile-service:8085
  PROVIDER_SERVICE_URL: http://provider-service:8086
  CHAT_SERVICE_URL: http://chat-service:8087
