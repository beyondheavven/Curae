openapi:
  server-url: http://localhost:8080
  server-description: Local server

spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        ddl-auto: none
        show_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

# todo Actuator need to add Spring Security.
# todo Authorisation will be required to access /health details and components, /env, /prometheus, /metrics, /info endpoints.

management:
  endpoints:
    web:
      exposure:
        include: "info, health, metrics, prometheus, env"

  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    build:
      enabled: true
    git:
      enabled: true
    env:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: Medfast API
    description: Internship project
    environment: stage


