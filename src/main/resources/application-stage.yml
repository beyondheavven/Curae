custom:
  security:
    public-routes: "/actuator/info"

management:
  endpoints:
    web:
      exposure:
        include: "info, health, metrics, prometheus, env"
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true
    git:
      enabled: false
    build:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: Medfast API
    description: Internship project
    environment: stage


