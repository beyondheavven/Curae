# todo Actuator need to add Spring Security.
# todo Authorisation will be required to access /health details and components, /env, /prometheus, /metrics, /info endpoints.
custom:
  security:
    public-routes: "/actuator/info, actuator/health/liveness, /actuator/readiness"

management:
  endpoints:
    web:
      exposure:
        include: "info, health, metrics, prometheus, env"
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: false
    git:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: Medfast API
    description: Internship project
    environment: stage


