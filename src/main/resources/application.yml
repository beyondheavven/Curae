openapi:
  server-url: http://localhost:8080/api
  server-description: Production server

springdoc:
  show-actuator: true
  group-configs:
    - group: "Medfast API"
      paths-to-match: "/**"
      paths-to-exclude: "/actuator/**"
    - group: "Actuator"
      paths-to-match: "/actuator/**"

spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  servlet:
    context-path: /api

app:
  jwt:
    secret: "very-long-secret-should-be-at-least-256-bit"
    access-token-expiration-ms: 900000        # 15 min
    refresh-token-expiration-ms: 2592000000   # 30 days
