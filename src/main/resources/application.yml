openapi:
  server-url: https://api.medfast.com
  server-description: Production server
springdoc:
  show-actuator: true
  group-configs:
    - group: "Medfast API"
      paths-to-match: "/**"
      paths-to-exclude: "/actuator/**"
    - group: "Actuator"
      paths-to-match: "/actuator/**"
spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        ddl-auto: none
        show_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  servlet:
    context-path: /api
app:
  jwt:
    secret: "very-long-secret-should-be-at-least-256-bit"
    access-token-expiration-ms: 900000        # 15 min
    refresh-token-expiration-ms: 2592000000   # 30 days
