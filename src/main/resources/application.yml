openapi:
  server-url: http://localhost:8080/api
  server-description: Production server

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  public-key: ${STRIPE_PUBLIC_KEY}
  webhook-secret: ${WEBHOOK_SECRET_KEY}
  payment-success-url: ${PAYMENT_SUCCESS_URL}
  payment-cancel-url: ${PAYMENT_CANCEL_URL}

springdoc:
  show-actuator: true
  group-configs:
    - group: "Medfast API"
      paths-to-match: "/**"
      paths-to-exclude: "/actuator/**"
    - group: "Actuator"
      paths-to-match: "/actuator/**"

spring:
  profiles:
    active: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guestGUEST777}
    password: ${RABBITMQ_PASSWORD:guestGUEST777}

server:
  servlet:
    context-path: /api

validation:
  password:
    regex: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d).{8,}$"

app:
  base-url: ${openapi.server-url}

  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:8000}

  mail:
    from: ${spring.mail.username}
    templates:
      verify-email: mail/verify-email
      reset-password: mail/reset-password
      doctor-welcome: mail/doctor-welcome

    subjects:
      verify-email: Email verification
      reset-password: Password reset code
      doctor-welcome: Welcome to Medfast

    paths:
      verify-email: /auth/verify
      reset-password: /auth/reset-password
      doctor-welcome: /account/set-password


  email-verification:
    ttl-ms: ${EMAIL_VERIFICATION_TTL_MS}
    verify-url: ${EMAIL_VERIFICATION_VERIFY_URL}


