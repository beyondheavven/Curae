custom:
  security:
    public-routes: "/actuator/**"

management:
  endpoints:
    web:
      exposure:
        include: "info, health, metrics, env, prometheus, loggers"

  endpoint:
    health:
      show-details: always
      show-components: always

  info:
    build:
      enabled: true
    git:
      enabled: true
    env:
      enabled: true

  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: Medfast API
    description: Internship project
    environment: dev
  database:
    url: ${POSTGRES_DB:unknown}
    port: ${POSTGRES_PORT:unknown}
    user: ${POSTGRES_USER:unknown}

openapi:
  server-url: http://localhost:8080/api
  server-description: Production server

springdoc:
  show-actuator: true
  group-configs:
    - group: "Medfast API"
      paths-to-match: "/**"
      paths-to-exclude: "/actuator/**"
    - group: "Actuator"
      paths-to-match: "/actuator/**"

spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 50

  mail:
    host: smtp.gmail.com
    port: 587
    username: medfast.noreply@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  flyway:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms

  cache:
    type: redis

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always

validation:
  password:
    regex: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d).{8,}$"

server:
  servlet:
    context-path: /api

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.cache: TRACE
    org.springframework.data.redis.cache: TRACE

app:
  base-url: ${openapi.server-url}

  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:8000}

  email-verification:
    ttl-ms: 3600000

  jwt:
    secret: "very-long-secret-should-be-at-least-256-bit"
    access-token-expiration-ms: 900000        # 15 min
    refresh-token-expiration-ms: 2592000000   # 30 days

  mail:
    from: ${spring.mail.username}

    templates:
      verify-email: mail/verify-email

    subjects:
      verify-email: Email verification

    paths:
      verify-email: /auth/verify

  rabbit:
    enabled: false
