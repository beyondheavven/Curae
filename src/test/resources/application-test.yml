testcontainers:
  reuse:
    enable: true

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    context-path: /api

  flyway:
    enabled: true
    locations:
      - filesystem:${user.dir}/flyway/sql
    clean-disabled: false

custom:
  security:
    public-routes: "/actuator/**"

logging:
  level:
    org.flywaydb: DEBUG

validation:
  password:
    regex: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d).{8,}$"

app:
  websocket:
    allowed-origins:
      - http://localhost:8000

  jwt:
    secret: "very-long-secret-should-be-at-least-256-bit"
    access-token-expiration-ms: 900000        # 15 min
    refresh-token-expiration-ms: 2592000000   # 30 days
