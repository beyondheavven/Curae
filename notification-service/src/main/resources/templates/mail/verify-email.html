<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Email verification</title>
</head>
<body style="margin:0;padding:0;background:#f5f7fa;font-family:Arial, sans-serif;">
<div style="max-width:520px;margin:40px auto;background:#ffffff;border-radius:14px;
              box-shadow:0 10px 25px rgba(0,0,0,0.08);padding:28px;">
    <div style="font-size:20px;font-weight:700;margin-bottom:8px;">Verify your email</div>
    <div style="color:#667085;margin-bottom:18px;">
        Hello! Please confirm your email to finish registration.
    </div>

    <div style="margin:22px 0;">
        <a style="display:inline-block;padding:12px 18px;border-radius:10px;
                background:#1976d2;color:#fff;text-decoration:none;font-weight:700;"
           th:href="${verifyLink}">
            Verify email
        </a>
    </div>
    <hr style="border:none;border-top:1px solid #eef2f6;margin:22px 0;"/>

    <div style="color:#98a2b3;font-size:12px;">
        If you did not register, you can safely ignore this email.
    </div>
</div>
</body>
</html>
