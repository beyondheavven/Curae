<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8"/>
        <title>Welcome to Curae</title>
    </head>
    <body>
        <div>
            <h2>Welcome to Curae</h2>
            <p>
                An account has been created for you.
            </p>
            <div>
                <p>Your temporary password is:</p>
                <h3 th:text="${tempPassword}">1234567</h3>
            </div>

            <p>
                <a th:href="${setupLink}">Set permanent password</a>
            </p>

            <hr/>

            <small>
                If you did not sign up for this account, you can ignore this email and the account will be deleted.
            </small>
        </div>
    </body>
</html>
